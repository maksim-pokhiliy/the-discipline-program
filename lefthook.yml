no_tty: true

pre-commit:
  parallel: true
  commands:
    lint:
      env:
        FORCE_COLOR: "1"
      run: pnpm lint --filter="...[HEAD]"
      stage_fixed: true
      fail_text: "ESLint failed - check the errors above"

    prettier:
      env:
        FORCE_COLOR: "1"
      glob: "*.{ts,tsx,md,json}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
      fail_text: "Prettier formatting failed"

    type-check:
      env:
        FORCE_COLOR: "1"
      run: pnpm check-types --filter="...[HEAD]"
      fail_text: "TypeScript compilation failed"

    test:
      env:
        SKIP_ENV_VALIDATION: "1"
        FORCE_COLOR: "1"
      run: pnpm turbo run test --filter="...[HEAD]"
      fail_text: "Tests failed - check the errors above"

pre-push:
  commands:
    dep-check:
      env:
        FORCE_COLOR: "1"
      run: pnpm dep:check
      fail_text: "Dependency-cruiser boundary rules violated — run `pnpm dep:check` locally for details"

commit-msg:
  commands:
    commitlint:
      env:
        FORCE_COLOR: "1"
      run: pnpm dlx commitlint --edit {1}
      fail_text: "Commit message format is invalid"
