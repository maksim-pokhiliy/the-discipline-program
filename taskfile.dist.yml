version: "3"

tasks:
  clean:
    desc: "Remove node_modules, .turbo, .next, dist"
    cmds:
      - node scripts/clean.mjs

  install:
    desc: "Install all dependencies"
    cmds:
      - pnpm install

  ci:
    desc: "Install dependencies in CI mode (frozen lockfile)"
    cmds:
      - pnpm install --frozen-lockfile

  dev:
    desc: "Run dev server for selected app (default: admin)"
    cmds:
      - pnpm turbo run dev

  build:
    desc: "Build the entire repo"
    cmds:
      - pnpm build

  preview:
    desc: "Build + start app in prod mode (default: admin)"
    cmds:
      - pnpm build
      - pnpm start

  lint:
    desc: "Run lint with fix across all packages"
    cmds:
      - pnpm lint

  format:
    desc: "Format all files"
    cmds:
      - pnpm format

  check-types:
    desc: "Run type checks across all packages"
    cmds:
      - pnpm check-types

  test:
    desc: "Run unit/integration tests (Vitest)"
    cmds:
      - pnpm test

  test:watch:
    desc: "Run unit/integration tests in watch mode"
    cmds:
      - pnpm test:watch

  test:coverage:
    desc: "Run unit/integration tests with coverage report (text + html in ./coverage)"
    cmds:
      - pnpm test:coverage

  e2e:
    desc: "Run all E2E browser tests (empty DB + seeded DB, Playwright headless)"
    cmds:
      - pnpm e2e

  e2e:empty:
    desc: "Run E2E tests against an empty database"
    cmds:
      - pnpm e2e:empty

  e2e:seeded:
    desc: "Run E2E tests against the seeded database"
    cmds:
      - pnpm e2e:seeded

  e2e:ui:
    desc: "Run E2E tests with interactive Playwright UI"
    cmds:
      - pnpm e2e:ui

  e2e:headed:
    desc: "Run E2E tests with visible browser"
    cmds:
      - pnpm e2e:headed

  test:all:
    desc: "Run all tests (Vitest + Playwright E2E)"
    cmds:
      - task: test
      - task: e2e

  db:generate:
    desc: "Generate Prisma client (run after schema changes)"
    cmds:
      - pnpm db:generate

  db:push:
    desc: "Push Prisma schema to the database"
    cmds:
      - pnpm db:push

  db:seed:
    desc: "Seed the database with baseline data"
    cmds:
      - pnpm db:seed

  dep:check:
    desc: "Validate dependency boundaries (bounded-context rules)"
    cmds:
      - pnpm dep:check

  dep:graph:
    desc: "Regenerate dependency graph (docs/DEPENDENCY-GRAPH.md)"
    cmds:
      - pnpm dep:graph

  analyze:admin:
    desc: "Bundle analysis for admin app"
    cmds:
      - pnpm analyze:admin

  analyze:marketing:
    desc: "Bundle analysis for marketing app"
    cmds:
      - pnpm analyze:marketing

  analyze:platform:
    desc: "Bundle analysis for platform app"
    cmds:
      - pnpm analyze:platform

  clean-start:
    desc: "Clean project, install dependencies, start dev server"
    cmds:
      - task: clean
      - task: ci
      - task: dev
