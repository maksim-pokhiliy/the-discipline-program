version: "3"

vars:
  TDP_DB_PORT: "5432"
  TDP_DB_URL: "postgres://postgres:postgres@localhost:{{.TDP_DB_PORT}}/tdp"
  TDP_TEST_DB_URL: "postgres://postgres:postgres@localhost:{{.TDP_DB_PORT}}/tdp_test"
  TDP_SHADOW_DB_URL: "postgres://postgres:postgres@localhost:{{.TDP_DB_PORT}}/tdp_shadow"
  TDP_DEMO_PASSWORD: "demo-athlete-12345"

tasks:
  clean:
    desc: "Remove node_modules, .turbo, .next, dist"
    cmds:
      - node scripts/clean.mjs

  install:
    desc: "Install all dependencies"
    cmds:
      - pnpm install

  ci:
    desc: "Install dependencies in CI mode (frozen lockfile)"
    cmds:
      - pnpm install --frozen-lockfile

  dev:
    desc: "Run dev server for selected app (default: admin)"
    cmds:
      - pnpm turbo run dev

  build:
    desc: "Build the entire repo"
    cmds:
      - pnpm build

  preview:
    desc: "Build + start app in prod mode (default: admin)"
    cmds:
      - pnpm build
      - pnpm start

  lint:
    desc: "Run lint with fix across all packages"
    cmds:
      - pnpm lint

  format:
    desc: "Format all files"
    cmds:
      - pnpm format

  check-types:
    desc: "Run type checks across all packages"
    cmds:
      - pnpm check-types

  test:
    desc: "Run unit/integration tests (Vitest)"
    cmds:
      - pnpm test

  test:watch:
    desc: "Run unit/integration tests in watch mode"
    cmds:
      - pnpm test:watch

  test:coverage:
    desc: "Run unit/integration tests with coverage report (text + html in ./coverage)"
    cmds:
      - pnpm test:coverage

  db:generate:
    desc: "Generate Prisma client (run after schema changes)"
    cmds:
      - pnpm db:generate

  db:deploy:
    desc: "Apply pending migrations (prisma migrate deploy)"
    cmds:
      - pnpm db:deploy

  db:migrate:
    desc: "Create + apply a dev migration (prisma migrate dev)"
    cmds:
      - pnpm db:migrate

  db:status:
    desc: "Show migration status (prisma migrate status)"
    cmds:
      - pnpm db:status

  db:reset:
    desc: "Reset the dev database (drops all data, re-applies migrations, re-seeds)"
    cmds:
      - pnpm db:reset

  db:seed:
    desc: "Seed the database with baseline data"
    cmds:
      - pnpm db:seed

  stack:up:
    desc: "Start the local Postgres stack (docker compose) and wait until it is healthy"
    env:
      TDP_DB_PORT: "{{.TDP_DB_PORT}}"
    cmds:
      - docker compose up -d --wait

  stack:down:
    desc: "Stop the local stack; the data volume is kept"
    cmds:
      - docker compose down

  stack:reset:
    desc: "Recreate the local stack from scratch: drop the volume, apply every migration, seed"
    env:
      TDP_DB_PORT: "{{.TDP_DB_PORT}}"
    cmds:
      - docker compose down -v
      - docker compose up -d --wait
      - task: stack:migrate
      - task: stack:seed

  stack:migrate:
    desc: "Apply pending migrations to the local dev and test databases (no seed)"
    cmds:
      - DATABASE_URL={{.TDP_DB_URL}} pnpm db:deploy
      - DATABASE_URL={{.TDP_TEST_DB_URL}} pnpm db:deploy

  stack:seed:
    desc: "Seed the local dev database (wipes domain data; recreates dev-coach + dev-admin)"
    cmds:
      - DATABASE_URL={{.TDP_DB_URL}} pnpm db:seed

  stack:demo:
    desc: "Seed the demo universe (demo coach + athlete, plan, published days) into the local dev database"
    cmds:
      - DATABASE_URL={{.TDP_DB_URL}} SHIM_DEMO_ATHLETE_PASSWORD={{.TDP_DEMO_PASSWORD}} pnpm --filter @repo/api-server exec tsx scripts/shim-demo-seed.ts --write --expect-host=localhost

  stack:psql:
    desc: "Open psql on the local dev database"
    interactive: true
    cmds:
      - docker compose exec db psql -U postgres -d tdp

  stack:logs:
    desc: "Tail the local Postgres logs"
    cmds:
      - docker compose logs -f db

  stack:env:
    desc: "Print the env lines that point Prisma and the apps at the local stack"
    silent: true
    cmds:
      - echo 'DATABASE_URL="{{.TDP_DB_URL}}"'
      - echo 'SHADOW_DATABASE_URL="{{.TDP_SHADOW_DB_URL}}"'

  stack:tunnel:
    desc: "Expose the platform dev server (3001) through a Cloudflare quick tunnel for provider webhooks"
    cmds:
      - cloudflared tunnel --url http://localhost:3001

  test:api:
    desc: "Run the api-server integration suite against the local test database (serial)"
    cmds:
      - DATABASE_URL={{.TDP_TEST_DB_URL}} pnpm --filter @repo/api-server test

  dep:check:
    desc: "Validate dependency boundaries (bounded-context rules)"
    cmds:
      - pnpm dep:check

  dep:graph:
    desc: "Regenerate dependency graph (docs/DEPENDENCY-GRAPH.md)"
    cmds:
      - pnpm dep:graph

  analyze:admin:
    desc: "Bundle analysis for admin app"
    cmds:
      - pnpm analyze:admin

  analyze:marketing:
    desc: "Bundle analysis for marketing app"
    cmds:
      - pnpm analyze:marketing

  analyze:platform:
    desc: "Bundle analysis for platform app"
    cmds:
      - pnpm analyze:platform

  clean-start:
    desc: "Clean project, install dependencies, start dev server"
    cmds:
      - task: clean
      - task: ci
      - task: dev
