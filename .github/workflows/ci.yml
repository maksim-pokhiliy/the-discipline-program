name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-flight CI for the same ref when a newer commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every job runs the same Node + pnpm pair that matches root package.json
  # `engines.node` and `packageManager`. Bump here in lockstep with the root.
  NODE_VERSION: "20"
  PNPM_VERSION: "10.33.0"

jobs:
  check-types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        # --frozen-lockfile fails the build if pnpm-lock.yaml is stale.
        # postinstall runs `pnpm --filter @repo/api-server db:generate` which invokes
        # `prisma generate` — it does NOT connect to the DB, it only reads
        # schema.prisma and emits types into node_modules/.prisma/client.
        run: pnpm install --frozen-lockfile

      - run: pnpm check-types

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - run: pnpm lint

  dep-check:
    name: Dependency boundary check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: dependency-cruiser boundary rules
        # Enforces docs/BOUNDED-CONTEXTS.md §8 at the file-import level.
        # See .dependency-cruiser.cjs for rule catalog. Closes 1.3.A.
        run: pnpm dep:check

  test:
    name: Tests
    runs-on: ubuntu-latest

    # Spin up a throwaway Postgres per run. The repo's Prisma schema is
    # pushed fresh before tests; no shared state, no CI↔local Neon collision.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_MARKETING_URL: http://localhost:3001
      # The root `test` script already sets SKIP_ENV_VALIDATION=1, but we
      # also need it during `prisma db push` to bypass the @repo/env zod
      # layer in case any import chain touches it.
      SKIP_ENV_VALIDATION: "1"

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Push Prisma schema to test Postgres
        # --skip-generate: we already generated via postinstall
        # --accept-data-loss: empty DB, nothing to lose
        run: pnpm --filter @repo/api-server db:push --skip-generate --accept-data-loss

      - name: Run tests
        run: pnpm test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest

    # Build doesn't need a real DB — Next.js pages in the repo are all
    # `export const dynamic = "force-dynamic"`, so no static SSR at build
    # time. Dummy values satisfy URL/string parse checks; SKIP_ENV_VALIDATION
    # bypasses the zod gates in @repo/env.
    env:
      SKIP_ENV_VALIDATION: "1"
      DATABASE_URL: postgres://dummy:dummy@localhost:5432/dummy
      NEXTAUTH_SECRET: dummy-secret-for-build
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_MARKETING_URL: http://localhost:3001
      BLOB_READ_WRITE_TOKEN: dummy-token

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - run: pnpm build
